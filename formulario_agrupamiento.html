<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Agrupamiento</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
        h2, legend { color: #007bff; font-weight: bold; }
        fieldset { border: 1px solid #ccc; border-radius: 6px; background: #fff; margin-bottom: 15px; padding: 15px; }
        input { margin-bottom: 10px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        button[type="submit"] { background: #007bff; }
        button[type="reset"] { background: #dc3545; }
    </style>
</head>
<body>
    <h2>Formularios con agrupamiento</h2>
    <form action="" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Datos personales</legend>
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br>
            Documento válido:
            <input type="file" name="documento"><br>
            Fecha de nacimiento:
            <input type="date" name="fecha_nacimiento">
        </fieldset>
        
        <fieldset>
            <legend>Datos de estudio:</legend>
            Nombre de la escuela:
            <input type="text" name="escuela"><br>
            Certificado válido:
            <input type="file" name="certificado"><br>
            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset>
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>
</html>
