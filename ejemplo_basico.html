<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Básico</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
        h2 { color: #007bff; }
        input[type="text"] { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"] { background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Ejemplo básico</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre" size="20">
        <br><br>
        <input type="submit" value="enviar">
    </form>
</body>
</html>
