<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Limitaciones</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
        h2 { color: #007bff; }
        input[type="text"], input[type="password"], textarea { margin-bottom: 10px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        input[disabled] { background-color: #e9ecef; cursor: not-allowed; }
        textarea[readonly] { background-color: #f8f9fa; color: #6c757d; }
    </style>
</head>
<body>
    <h2>Formulario con limitaciones</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <!-- Deshabilitación de campo -->
        <input type="text" name="nombre" disabled><br>
        <!-- Limitación de caracteres -->
        Contraseña:
        <input type="password" name="pass" maxlength="5"><br>
        <!-- Solo lectura -->
        Comentarios:
        <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><br>
    </form>
</body>
</html>
