<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Archivos</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
        h2 { color: #007bff; }
        input { margin-bottom: 10px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        button[type="submit"] { background: #007bff; }
        button[type="reset"] { background: #dc3545; }
    </style>
</head>
<body>
    <h2>Formulario con archivos</h2>
    <form action="" method="post" enctype="multipart/form-data">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        <input type="file" name="archivo">
        <br><br>
        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>
</html>
