<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Radiobotón</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
        h2 { color: #007bff; }
        input[type="text"] { margin-bottom: 10px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="radio"] { margin-right: 5px; margin-bottom: 8px; }
        input[type="submit"], input[type="reset"] { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        input[type="submit"] { background: #007bff; }
        input[type="reset"] { background: #dc3545; }
    </style>
</head>
<body>
    <h2>Formularios con Radiobotón</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br><br>
        Selecciona el máximo de estudios que tienes:
        <br><br>
        <input type="radio" name="estudios" value="1"> Sin estudios <br>
        <input type="radio" name="estudios" value="2"> Primaria <br>
        <input type="radio" name="estudios" value="3"> Secundaria <br>
        <input type="radio" name="estudios" value="4"> Preparatoria <br><br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
