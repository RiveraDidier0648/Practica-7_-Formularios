<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Textarea</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
        h2 { color: #007bff; }
        input[type="text"], input[type="email"], textarea { margin-bottom: 10px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        input[type="submit"], input[type="reset"] { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        input[type="submit"] { background: #007bff; }
        input[type="reset"] { background: #dc3545; }
    </style>
</head>
<body>
    <h2>Formulario con text area</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Ingresa tu correo:
        <input type="email" name="correo">
        <br>
        Ingresa tus comentarios:
        <textarea name="comentarios" rows="3" cols="20"></textarea>
        <br><br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
