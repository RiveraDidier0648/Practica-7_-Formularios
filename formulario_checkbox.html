<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Checkbox</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
        h2 { color: #007bff; }
        input[type="text"] { margin-bottom: 10px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="checkbox"] { margin-right: 5px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h2>Formularios con checkbox</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br><br>
        Selecciona los lenguajes que conozcas:
        <br><br>
        <input type="checkbox" name="Java"> Java <br>
        <input type="checkbox" name="Python"> Python <br>
        <input type="checkbox" name="C#"> C# <br>
        <input type="checkbox" name="Flutter"> Flutter <br>
    </form>
</body>
</html>
