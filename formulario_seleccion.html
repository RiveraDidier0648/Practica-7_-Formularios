<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Selección</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; }
        h2 { color: #007bff; }
        input[type="text"], select { margin-bottom: 10px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="submit"], input[type="reset"] { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        input[type="submit"] { background: #007bff; }
        input[type="reset"] { background: #dc3545; }
    </style>
</head>
<body>
    <h2>Formularios con selección</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre">
        <br>
        Selecciona tu país:
        <select name="pais">
            <option value="1">Argentina</option>
            <option value="2">España</option>
            <option value="3">México</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="6">El Salvador</option>
            <option value="7">Venezuela</option>
            <option value="8">Colombia</option>
        </select>
        <br><br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
    </form>
</body>
</html>
